<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolStudio (Mobile Apps)</title>
    <style>
        /* CSS Styles */

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #2c3e50;
            color: #fff
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(0, 0, 0, .6);
            padding: 20px;
            border-radius: 10px
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px
        }

        .game-info {
            margin-bottom: 40px
        }

        .game-name {
            font-size: 32px;
            margin-bottom: 10px
        }

        .game-name a {
            color: #fff;
            text-decoration: none
        }

        .game-image {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px
        }

        .game-links {
            margin-bottom: 20px
        }

        .game-link {
            text-decoration: none;
            color: #fff;
            margin: 0 10px
        }

        .game-link img {
            vertical-align: middle;
            max-width: 50%;
            height: auto
        }

        .copyright {
            font-size: 16px;
            margin-top: 40px
        }
        .contact-email {
            margin-top: 10px;
            font-size: 16px;
        }
        .contact-email a {
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>ToolStudio (Mobile Apps)</h1>
        <div class="game-info">
            <h2 class="game-name">
                <a href="https://play.google.com/store/apps/details?id=soccer.football.save.goal.sportgame.worldcup">Goalkeeper Challenge</a>
            </h2>
            <a href="https://play.google.com/store/apps/details?id=soccer.football.save.goal.sportgame.worldcup">
                <img class="game-image"
                    src="./mw_img1.png"
                    alt="Mech Warzone Img 1">
            </a>
            <div class="game-links">
                <a class="game-link" href="https://play.google.com/store/apps/details?id=soccer.football.save.goal.sportgame.worldcup">
                    <img src="./gp_badge.png"
                        alt="Google Play Badge">
                </a>
            </div>
        </div>
        <div class="game-info">
            <h2 class="game-name">
                <a href="https://play.google.com/store/apps/details?id=com.shooter.pop.bubblevoyage">Bubble Voyage</a>
            </h2>
            <a href="https://play.google.com/store/apps/details?id=com.shooter.pop.bubblevoyage">
                <img class="game-image"
                    src="./mw_img2.png"
                    alt="Road Mover Img">
            </a>
            <div class="game-links">
                <a class="game-link" href="https://play.google.com/store/apps/details?id=com.shooter.pop.bubblevoyage">
                    <img src="./gp_badge.png"
                        alt="Google Play Badge">
                </a>
            </div>
        </div>
        <div class="copyright">
            &copy; 2025 ToolStudio (Mobile Apps). All rights reserved.
        </div>
        <div class="contact-email">
            Contact: <a href="mailto:game@freegamehub.top">game@freegamehub.top</a>
        </div>
    </div>
</body>

</html>
